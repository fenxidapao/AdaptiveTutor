name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（API 最小栈 + 测试工具；不含 torch/streamlit 大件）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: 语法编译检查（所有核心模块）
        run: |
          python -m py_compile rag_core.py rag_search_utils.py reranker.py \
            app.py main.py api_schemas.py config.py health.py query_log.py \
            eval_data.py eval_local.py run_ab.py \
            eval_data_heldout.py grounding.py backup_index.py eval_heldout.py \
            api_security.py ingest_ocr.py

      - name: 核心算法单测（零外部依赖）
        run: python test_core.py

      - name: API 端点测试（mock 外部依赖，无需 Ollama）
        run: python -m pytest test_api.py -v

      - name: 检索冒烟测试（需 Ollama，CI 环境自动 skip）
        run: python -m pytest test_retrieval.py -v
