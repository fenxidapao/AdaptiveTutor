# ============================================================
# CourseRAG 一键部署：Ollama（推理/嵌入）+ API 服务（FastAPI）
# 用法：
#   docker compose up -d --build
#   docker compose exec ollama ollama pull nomic-embed-text llama3.1:8b   # 首次拉模型
#   curl http://localhost:8000/health
# ============================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: coursrag-ollama
    volumes:
      - ollama_models:/root/.ollama   # 模型权重持久化（重起容器不重拉）
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: coursrag-api
    depends_on:
      ollama:
        condition: service_healthy   # Ollama 就绪后再启动 API
    environment:
      # 容器网络内用服务名互访（宿主无需暴露 Ollama 到外部）
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.1:8b
      # 镜像未装 torch/sentence-transformers → 容器内不启用 reranker
      RERANKER_ENABLED: "false"
      HF_ENDPOINT: https://hf-mirror.com
      DATA_DIR: /app/data
      PERSIST_DIRECTORY: /app/chroma_db
      QUERY_LOG_PATH: /app/.query_log.jsonl
    volumes:
      - ./data:/app/data              # 课程资料（挂宿主目录，方便增删）
      - ./chroma_db:/app/chroma_db    # 向量库持久化
    ports:
      - "8000:8000"                   # API 端口（Swagger UI: http://localhost:8000/docs）
    restart: unless-stopped

volumes:
  ollama_models:
